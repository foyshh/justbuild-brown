<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Studio Dashboard | Just Build</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#2A2015"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=Inter:wght@300..500&display=swap" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<link href="css/portal.css" rel="stylesheet"/>
</head>
<body class="portal-page">

<header class="site-nav">
  <div class="wrap">
    <a href="index.html" class="nav-mark">
      <span class="name">Just Build</span>
      <span class="sub">Studio Dashboard</span>
    </a>
    <div class="portal-account" data-portal-account></div>
  </div>
</header>

<main class="wrap portal-main studio" id="studioDashboard">
  <aside class="studio-side" aria-label="Projects">
    <div class="studio-side-head">
      <h2 class="portal-h2">Projects</h2>
      <button type="button" class="text-link studio-new" data-new-project>Add project</button>
    </div>
    <ul class="studio-list" data-project-list></ul>
    <p class="studio-demo-note">Preview mode: changes are saved in this browser only. <button type="button" class="studio-reset" data-reset>Reset sample data</button></p>
  </aside>
  <div class="studio-editor" data-editor></div>
</main>

<div class="studio-toast" id="studioToast" role="status" aria-live="polite"></div>

<datalist id="jbImages">
  <option value="images/projects/cairnhill/02.jpg"></option>
  <option value="images/projects/cairnhill/05.jpg"></option>
  <option value="images/projects/cairnhill/08.jpg"></option>
  <option value="images/projects/cobalt/04.jpg"></option>
  <option value="images/projects/cobalt/07.jpg"></option>
  <option value="images/projects/meridian/05.jpg"></option>
  <option value="images/projects/obsidian/06.jpg"></option>
  <option value="images/projects/sundial/04.jpg"></option>
</datalist>

<script src="js/site.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
